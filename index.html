      ['Трицепс',['Французский жим','Разгибание предплечий двумя руками сидя из-за головы','Разгибание рук на верхнем блоке тренажёра (косичка)']]
    ]},
    {id:5, groups:[
      ['Мышцы ног',['Приседания в машине Смита','Сгибание ног на тренажёре лёжа','Разгибание ног сидя в тренажёре']],
      ['Дельты (плечи)',['Жим воина сидя в Смите из-за головы','Протяжка штанги к подбородку','Отведение одной руки с гантелью стоя в упоре','Шраги с блинами или гантелями (или со штангой)']]
    ]},
    {id:6, groups:[
      ['Грудные мышцы',['Жим штанги на горизонтальной скамье','Жим в машине Смита на наклонной скамье','Сведение рук на горизонтальной скамье с гантелями','Пуловер']],
      ['Бицепс',['Сгибание рук со штангой стоя','Сгибание рук с гантелями стоя поочерёдно','Сгибание руки с гантелью в упоре в колено (хват «молот»)']]
    ]},
    {id:7, groups:[
      ['Спина',['Становая тяга','Тяга на верхнем блоке широким хватом за голову','Тяга на нижнем блоке широким хватом','«Дровосек» в кроссовере']],
      ['Трицепс',['Разгибание рук с гантелью из-за головы','Разгибание рук на верхнем блоке тренажёра (палка)','Разгибание рук на верхнем блоке тренажёра (косичка)','Отжимания из упора сзади']]
    ]},
    {id:8, groups:[
      ['Мышцы ног',['Приседания со штангой','Сведение ног на тренажёре','Разведение ног на тренажёре','Выпады с гантелями']],
      ['Дельты (плечи)',['Жим воина с гантелями сидя','Разведение двумя руками через стороны в кроссовере','Шраги с блинами или гантелями (или со штангой)']]
    ]},
    {id:9, groups:[
      ['Грудные мышцы',['Жим в машине Смита на горизонтальной скамье','Жим гантелей на наклонной скамье','Сведение рук на горизонтальной скамье с гантелями','Отжимания от пола']],
      ['Бицепс',['Сгибание рук со штангой стоя','Попеременное сгибание рук с гантелями сидя на наклонной скамье','Сгибание руки с гантелью в упоре в скамью']]
    ]}
  ];
  const PRESS = [
    'Скручивание на наклонной скамье',
    'Скручивание лёжа на горизонтальной поверхности',
    'Поднимание ног лёжа на горизонтальной поверхности',
    'Одновременный подъём ног и туловища из положения лёжа',
    'Подъёмы ног в висе с прижатой спиной',
    'Подъёмы ног на наклонной скамье'
  ];
  const ICONS = {
    workout:'<path d="m6.5 6.5 11 11M4 8l4-4M2 6l4-4m10 18 4-4m-2 6 4-4M8 4l12 12M4 8l12 12"/>',
    history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    abs:'<path d="M7 3h10l3 5v10l-3 3H7l-3-3V8zM12 3v18M4 12h16M7 8h10m-10 9h10"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13a7 7 0 0 0 0-2l2-1-2-4-2 1a7 7 0 0 0-2-1l-1-3h-4L9 6a7 7 0 0 0-2 1L5 6 3 10l2 1a7 7 0 0 0 0 2l-2 1 2 4 2-1a7 7 0 0 0 2 1l1 3h4l1-3a7 7 0 0 0 2-1l2 1 2-4z"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    chevron:'<path d="m6 9 6 6 6-6"/>',
    right:'<path d="m9 6 6 6-6 6"/>',
    left:'<path d="m15 6-6 6 6 6"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',
    upload:'<path d="M12 21V9m-4 4 4-4 4 4M4 7V3h16v4"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-8h.01"/>',
    trash:'<path d="M3 6h18m-2 0-1 14H6L5 6m3 0V4h8v2m-6 4v7m4-7v7"/>',
    trophy:'<path d="M8 4h8v9a4 4 0 0 1-8 0zm0 2H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 4v4m-4 0h8"/>',
    bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7z"/>',
    more:'<path d="M12 5v.01M12 12v.01M12 19v.01"/>',
    lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
  };
  const icon = (key, extra='') => `<svg class="ic ${extra}" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.info}</svg>`;
  const escapeHtml = (s) => String(s??'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const now = () => new Date().toISOString();
  const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const blank = () => ({schema:1,nextWorkout:1,sessions:[],activeWorkoutId:null,activePressId:null});
  let store = blank();
  let storageError=false;
  try {
    const raw=localStorage.getItem(KEY);
    if(raw) {
      const saved=JSON.parse(raw);
      if(saved && Array.isArray(saved.sessions)) store={...blank(), ...saved};
    }
  } catch(e) {storageError=true;}
  const ui={tab:'workout', preview: store.nextWorkout, browsePlans:false, expanded:new Set(), historyId:null, pressChoices:new Set(), toast:''};
  const persist=()=>{ try {localStorage.setItem(KEY,JSON.stringify(store));storageError=false;} catch(e) {storageError=true;} };
  const app=document.getElementById('app');
  const pname = (id) => { const p=PROGRAM.find(p=>p.id===Number(id)); return p ? p.groups.map(g=>g[0].replace('Мышцы ног','Ноги').replace('Грудные мышцы','Грудь').replace('Дельты (плечи)','Плечи')).join(' + ') : 'Пресс'; };
  const programEx = (id)=>PROGRAM[Number(id)-1].groups.flatMap(([group,names])=>names.map((name,i)=>({key:uid(), group, name, sets:Array.from({length:3},()=>({id:uid(),weight:'',reps:'',done:false}))})));
  const sessionById=(id)=>store.sessions.find(x=>x.id===id);
  const activeWorkout=()=>sessionById(store.activeWorkoutId);
  const activePress=()=>sessionById(store.activePressId);
  const dateFmt=(iso)=>{try{return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}catch{return 'Дата не указана';}};
  const timeFmt=(iso)=>{try{return new Date(iso).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch{return '';}};
  const counts=(session)=>{

  function renderSettings(){

  function createSession(type,trainingId=null,names=null){
    const exercises=type==='workout'?programEx(trainingId):(names||[]).map(name=>({key:uid(),group:'Пресс',name,sets:Array.from({length:3},()=>({id:uid(),weight:'',reps:'',done:false}))}));

  }
  function beginWorkout(id){
    if(activeWorkout()){toast('Сначала заверши текущую тренировку');return;}

  }
  function finishSession(type){
    const s=type==='workout'?activeWorkout():activePress();if(!s)return;

    if(type==='workout'){ui.browsePlans=false;store.activeWorkoutId=null;store.nextWorkout=s.trainingId===9?1:s.trainingId+1;ui.preview=store.nextWorkout;ui.tab='workout';}
    else {store.activePressId=null;ui.pressChoices=new Set();ui.tab='press';}

  }
  function getEx(el){const s=sessionById(el.dataset.session);const i=Number(el.dataset.ex);return [s,s?.exercises?.[i],i]}
  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(action==='tab'){ui.tab=el.dataset.tab;ui.browsePlans=false;ui.historyId=null;rerender(false);return;}
     if(action==='browse-plans'){const s=activeWorkout();if(!s)return;ui.browsePlans=true;ui.preview=s.trainingId===9?1:s.trainingId+1;rerender(false);return;}
     if(action==='return-workout'){ui.browsePlans=false;rerender(false);return;}
    if(action==='preview'){ui.preview=Number(el.dataset.id);rerender(true);return;}
    if(action==='start-next'){beginWorkout(store.nextWorkout);return;}
    if(action==='start-selected'){beginWorkout(Number(el.dataset.id));return;}
    if(action==='expand'){const [s,ex]=getEx(el);if(!ex)return;const k=s.id+'-'+ex.key;ui.expanded.has(k)?ui.expanded.delete(k):ui.expanded.add(k);rerender(true);return;}
    if(action==='exercise-toggle'){const [s,ex]=getEx(el);if(!ex)return;const newDone=!ex.sets.every(x=>x.done);ex.sets.forEach(x=>x.done=newDone);persist();rerender(true);return;}
    if(action==='set-toggle'){const [s,ex]=getEx(el);if(!ex)return;const set=ex.sets[Number(el.dataset.set)];if(!set)return;set.done=!set.done;persist();rerender(true);return;}
    if(action==='add-set'){const [s,ex]=getEx(el);if(!ex)return;const last=ex.sets[ex.sets.length-1];ex.sets.push({id:uid(),weight:last?.weight??'',reps:last?.reps??'',done:false});persist();rerender(true);return;}
    if(action==='remove-set'){const [s,ex]=getEx(el);if(!ex||ex.sets.length<=1)return;ex.sets.pop();persist();rerender(true);return;}
    if(action==='complete-workout'){finishSession('workout');return;}
    if(action==='complete-press'){finishSession('press');return;}
    if(action==='start-press'){if(activePress()||ui.pressChoices.size===0)return;const s=createSession('press',null,[...ui.pressChoices].sort((a,b)=>a-b).map(i=>PRESS[i]));store.sessions.push(s);store.activePressId=s.id;ui.expanded.add(s.id+'-'+s.exercises[0].key);persist();rerender(false);return;}
    if(action==='history-open'){ui.historyId=el.dataset.session;const s=sessionById(ui.historyId);if(s&&s.exercises.length)ui.expanded.add(s.id+'-'+s.exercises[0].key);rerender(false);return;}
    if(action==='history-back'){ui.historyId=null;rerender(false);return;}
    if(action==='delete-history'){const s=sessionById(el.dataset.session);if(!s)return;if(!confirm('Удалить эту тренировку из истории? Действие нельзя отменить без резервной копии.'))return;store.sessions=store.sessions.filter(x=>x.id!==s.id);ui.historyId=null;persist();rerender(false);toast('Запись удалена');return;}
    if(action==='export'){exportBackup();return;}
    if(action==='import-trigger'){document.getElementById('backup-file')?.click();return;}
    if(action==='clear-all') {if(!confirm('Удалить ВСЕ тренировки, подходы и историю с этого телефона?'))return;if(!confirm('Точно удалить? Рекомендуем сначала скачать резервную копию.'))return;store=blank();ui.preview=1;ui.expanded.clear();ui.historyId=null;ui.pressChoices.clear();persist();rerender(false);toast('Данные удалены');return;}
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(!el.matches('input[data-input]'))return;
    const [s,ex]=getEx(el);const set=ex?.sets[Number(el.dataset.set)];if(!set)return;
    let value=el.value;
    if(value&&Number(value)<0)value='0';
    if(el.dataset.input==='reps'&&value)value=String(Math.min(999,Math.max(0,Math.floor(Number(value)))));
    if(el.dataset.input==='weight'&&value)value=String(Math.min(99999,Number(value)));
    set[el.dataset.input]=value;persist();
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.matches('[data-press-pick]')){const i=Number(el.dataset.pressPick);el.checked?ui.pressChoices.add(i):ui.pressChoices.delete(i);rerender(true);return;}
    if(el.id==='backup-file'&&el.files?.[0]){importBackup(el.files[0]);}
  });
  function exportBackup(){
    const documentData={format:'my_training_diary',exportedAt:now(),data:store};
    const blob=new Blob([JSON.stringify(documentData,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`trenirovki-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Резервная копия подготовлена');
  }
  async function importBackup(file){
    try{
      if(file.size>20*1024*1024)throw new Error('Файл слишком большой');
      const body=JSON.parse(await file.text());
      if(body.format!=='my_training_diary'||!body.data||!Array.isArray(body.data.sessions))throw new Error('Неверный формат резервной копии');
      const parsed=body.data;
      const sessions=parsed.sessions;
      if(sessions.some(s=>!s||typeof s.id!=='string'||!Array.isArray(s.exercises)||!['press','workout'].includes(s.type)||!['completed','active'].includes(s.status)||s.exercises.some(ex=>!Array.isArray(ex.sets)||typeof ex.name!=='string'||ex.sets.some(set=>typeof set.done!=='boolean'))))throw new Error('Повреждены данные тренировок');
      const unique=new Set(store.sessions.map(s=>s.id));let added=0;
      for(const s of sessions){if(!unique.has(s.id)){store.sessions.push(s);unique.add(s.id);added++;}}
      if(!store.activeWorkoutId && parsed.activeWorkoutId && store.sessions.some(s=>s.id===parsed.activeWorkoutId&&s.status==='active'))store.activeWorkoutId=parsed.activeWorkoutId;
      if(!store.activePressId && parsed.activePressId && store.sessions.some(s=>s.id===parsed.activePressId&&s.status==='active'))store.activePressId=parsed.activePressId;
      if(store.sessions.length===added&&Number.isInteger(parsed.nextWorkout)&&parsed.nextWorkout>=1&&parsed.nextWorkout<=9)store.nextWorkout=parsed.nextWorkout;
      persist();rerender(true);toast(`Импорт завершён: добавлено ${added} записей`);
    }catch(e){alert('Не удалось импортировать резервную копию. '+e.message);}
  }
  rerender(false);
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();

</script>
</body>
